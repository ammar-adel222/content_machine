[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-machine"
version = "0.1.0"
description = "Agent-native 2D AI/CS content production harness"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
cm = "cm.cli:app"

[tool.setuptools.packages.find]
include = ["cm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
