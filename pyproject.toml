[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-machine"
version = "0.1.0"
description = "Agent-native 2D AI/CS content production harness"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0",
    "pillow>=10.0",
    "playwright>=1.49",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
cm = "cm.cli:app"

[tool.setuptools.packages.find]
include = ["cm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.coverage.run]
source = ["cm"]
branch = true
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
