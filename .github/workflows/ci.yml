name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run Ruff lint checks
        run: ruff check cm tests

      - name: Run pytest with branch coverage gate
        run: pytest -v --cov=cm --cov-branch --cov-fail-under=95

      - name: CLI smoke check on reference blueprint
        run: cm validate examples/password_system.blueprint.json
